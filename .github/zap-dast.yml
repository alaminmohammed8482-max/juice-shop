- name: Prepare ZAP workspace
  run: mkdir -p $GITHUB_WORKSPACE/zap/wrk

- name: Run ZAP Baseline Scan
  run: |
    docker run --rm \
      -v $GITHUB_WORKSPACE/zap/wrk:/zap/wrk:Z \
      ghcr.io/zaproxy/zaproxy:stable \
      zap-baseline.py \
      -t http://localhost:3000 \
      -g /zap/wrk/zap.yaml \
      -r /zap/wrk/zap-baseline-report.html
