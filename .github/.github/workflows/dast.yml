name: DAST - ZAP baseline on merge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-dast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t juice-shop-secure:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d --name juiceci -p 3000:3000 juice-shop-secure:${{ github.sha }}
          # wait until app responds
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:3000 > /dev/null; then echo "app up" && break; fi
            sleep 2
          done

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: "http://localhost:3000"
          fail_build: false
          format: "HTML"
          output_file: "zap-baseline-report.html"

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-baseline-report.html

      - name: Stop container (always)
        if: always()
        run: |
          docker stop juiceci || true
          docker rm juiceci || true
